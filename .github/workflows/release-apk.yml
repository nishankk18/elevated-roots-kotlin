name: Release APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest successful Android CI artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs?status=completed&per_page=10" | \
            python3 -c 'import sys,json; runs=json.load(sys.stdin)["workflow_runs"]; print(next(r["id"] for r in runs if r["conclusion"]=="success"))')
          ARTIFACT_ID=$(curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" | \
            python3 -c 'import sys,json; arts=json.load(sys.stdin)["artifacts"]; print(next(a["id"] for a in arts if a["name"]=="debug-apk" and not a["expired"]))')
          curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip
          unzip -o artifact.zip

      - name: Find APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find . -name "*.apk" -type f | head -1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.APK }}
          repository: nishankk18/elevated-roots-kotlin
          tag_name: v1.0.3-apk
          name: Elevated Roots MA APK v1.0.3
          draft: false
          overwrite_files: true
          body: "Pure Kotlin WebView app - opens https://www.elevatedrootsma.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
