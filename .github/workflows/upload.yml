name: Upload APK

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract APK
        run: |
          curl -sL "https://api.github.com/repos/nishankk18/elevated-roots-kotlin/actions/artifacts/6171896661/zip" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o artifact.zip
          unzip -o artifact.zip
          ls -la

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"

      - name: Delete old asset
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          
          ASSET_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases/$RELEASE_ID/assets" | \
            python3 -c "import sys,json; assets=json.load(sys.stdin); print(assets[0]['id'] if assets else '')")
          
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting asset $ASSET_ID"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/nishankk18/elevated-roots/releases/assets/$ASSET_ID"
          fi

      - name: Upload new APK
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "Uploading $APK_PATH to release $RELEASE_ID"
          
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK_PATH" \
            "https://uploads.github.com/repos/nishankk18/elevated-roots/releases/$RELEASE_ID/assets?name=elevated-roots-v1.0.0.apk" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('browser_download_url', d.get('message','uploaded')))"
