name: Upload APK

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract APK
        run: |
          curl -sL "https://api.github.com/repos/nishankk18/elevated-roots-kotlin/actions/artifacts/6171896661/zip" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o artifact.zip
          unzip -o artifact.zip
          ls -la

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"

      - name: Upload new APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK file: $APK_PATH (size: $APK_SIZE bytes)"
          
          # Get release ID
          echo "Getting release ID..."
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          echo "Release ID: $RELEASE_ID"
          
          # Delete old asset
          echo "Checking for old assets..."
          ASSET_RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases/$RELEASE_ID/assets")
          echo "Asset response: $ASSET_RESPONSE"
          
          ASSET_ID=$(echo "$ASSET_RESPONSE" | python3 -c "import sys,json; assets=json.load(sys.stdin); print(assets[0]['id'] if assets else '')")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting old asset $ASSET_ID..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/nishankk18/elevated-roots/releases/assets/$ASSET_ID"
            echo "Delete response: $?"
          fi
          
          # Upload new APK
          echo "Uploading APK..."
          UPLOAD_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Content-Length: $APK_SIZE" \
            --data-binary "@$APK_PATH" \
            "https://uploads.github.com/repos/nishankk18/elevated-roots/releases/$RELEASE_ID/assets?name=elevated-roots-v1.0.0.apk" 2>&1)
          echo "Upload response: $UPLOAD_RESPONSE"
