name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload to Elevated Roots Release
        run: |
          # Get existing release ID
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases" | \
            python3 -c "import sys,json; releases=json.load(sys.stdin); print(releases[0]['id'] if releases else '')")
          
          if [ -z "$RELEASE_ID" ]; then
            echo "No release found"
            exit 1
          fi
          
          # Delete old asset
          ASSET_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nishankk18/elevated-roots/releases/$RELEASE_ID/assets" | \
            python3 -c "import sys,json; assets=json.load(sys.stdin); print(assets[0]['id'] if assets else '')")
          
          if [ -n "$ASSET_ID" ]; then
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/nishankk18/elevated-roots/releases/assets/$ASSET_ID"
          fi
          
          # Upload new APK
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@android/app/build/outputs/apk/debug/app-debug.apk" \
            "https://uploads.github.com/repos/nishankk18/elevated-roots/releases/$RELEASE_ID/assets?name=elevated-roots-v1.0.0.apk" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('browser_download_url', d.get('message','uploaded')))"
